name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg16
        env:
          POSTGRES_USER: supportdesk
          POSTGRES_PASSWORD: supportdesk
          POSTGRES_DB: supportdesk
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U supportdesk -d supportdesk"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql+psycopg://supportdesk:supportdesk@localhost:5432/supportdesk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements-torch.txt
            requirements.txt
            requirements-dev.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: huggingface-${{ hashFiles('src/supportdesk/config.py') }}
      - run: make deps-torch
      - run: make deps-dev
      - run: make install
      - run: make lint
      - run: make format-check
      - run: make test
      - run: make cost
      - run: make migrate
      - run: make ingest
      - run: make eval
